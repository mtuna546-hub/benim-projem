name: AB Fon Çağrı Taraması

on:
  schedule:
    # Her Çarşamba 09:00 (İstanbul, UTC+3)
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: eu-funding-report
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r eu_funding_tracker/requirements.txt

      - name: Testler
        working-directory: eu_funding_tracker
        run: python -m unittest discover -s tests

      - name: Portalı tara ve eşleştir
        working-directory: eu_funding_tracker
        run: python track.py

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-fon-raporu
          path: eu_funding_tracker/reports/
          if-no-files-found: ignore

      - name: Raporu ve durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eu_funding_tracker/state.json
          git add -f eu_funding_tracker/reports/
          git diff --cached --quiet || git commit -m "Güncel AB fon raporu ve durum güncellemesi: $(date -u +%F)"
          git push

      # GitHub, repo sahibine yeni issue'ları kendi bildirim e-postasıyla iletir;
      # bu yüzden SMTP ya da Gmail şifresi gerekmez.
      - name: Raporu GitHub Issue olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(ls -1 eu_funding_tracker/reports/rapor-*.md | sort | tail -n 1)
          summary=$(ls -1 eu_funding_tracker/reports/ozet-*.md | sort | tail -n 1)
          title=$(head -n 1 "$summary" | sed 's/^# //')
          link="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/$report"
          {
            echo "@${{ github.repository_owner }} haftalık AB fon taraması tamamlandı. Tüm eşleşmeleri içeren tam rapor: $link"
            echo
            head -c 60000 "$summary"
          } > issue_body.md
          gh issue list --state open --search "AB Fon Çağrıları in:title" --json number,author \
            -q '.[] | select(.author.login == "app/github-actions" or .author.login == "github-actions") | .number' \
            | xargs -r -n1 gh issue close --comment "Yeni haftalık rapor yayınlandı."
          gh issue create --title "$title" --body-file issue_body.md

      - name: Hata bildir
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "AB fon taraması başarısız ($(date -u +%F))" \
            --body "@${{ github.repository_owner }} haftalık tarama hata verdi. Ayrıntılar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
