name: AB Fon Çağrı Taraması

on:
  schedule:
    # Her Çarşamba 08:47 (İstanbul, UTC+3). Tam saat başı GitHub'da en yoğun an olduğu için
    # zamanlanmış işler saatlerce gecikebiliyor; dakikayı kaydırmak bunu azaltır.
    - cron: "47 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: eu-funding-report
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gecikmeli gelen zamanlanmış çalıştırma, o gün elle yapılmış bir taramanın ardından
      # ikinci bir rapor issue'su açmasın.
      - name: Bugünün raporu zaten var mı?
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "eu_funding_tracker/reports/issue-$(date -u +%F).md" ]; then
            echo "Bugünün raporu zaten üretilmiş; zamanlanmış çalıştırma atlanıyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r eu_funding_tracker/requirements.txt

      - name: Testler
        if: steps.guard.outputs.skip != 'true'
        working-directory: eu_funding_tracker
        run: python -m unittest discover -s tests

      - name: Portalı tara ve eşleştir
        if: steps.guard.outputs.skip != 'true'
        working-directory: eu_funding_tracker
        run: python track.py

      - name: Raporu sakla
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ab-fon-raporu
          path: eu_funding_tracker/reports/
          if-no-files-found: ignore

      - name: Raporu ve durumu kaydet
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eu_funding_tracker/state*.json eu_funding_tracker/topic_cache.json 2>/dev/null || git add eu_funding_tracker/state*.json
          git add -f eu_funding_tracker/reports/
          git diff --cached --quiet || git commit -m "Güncel AB fon raporu ve durum güncellemesi: $(date -u +%F)"
          git push

      # GitHub, repo sahibine yeni issue'ları kendi bildirim e-postasıyla iletir;
      # bu yüzden SMTP ya da Gmail şifresi gerekmez.
      - name: Raporu GitHub Issue olarak yayınla
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # issue-*.md: Mühendislik Fakültesi özeti, altında açılır bölümde genel rapor.
          body=$(ls -1 eu_funding_tracker/reports/issue-*.md | sort | tail -n 1)
          title=$(head -n 1 "$body" | sed 's/^# //')
          base="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/eu_funding_tracker/reports"
          {
            echo "@${{ github.repository_owner }} haftalık AB fon taraması tamamlandı. Tüm eşleşmeleri içeren tam raporlar (muhendislik-rapor-*, rapor-*): $base"
            echo
            cat "$body"
          } > issue_body.md
          gh issue list --state open --search "AB Fon Çağrıları in:title" --json number,author \
            -q '.[] | select(.author.login == "app/github-actions" or .author.login == "github-actions") | .number' \
            | xargs -r -n1 gh issue close --comment "Yeni haftalık rapor yayınlandı."
          url=$(gh issue create --title "$title" --body-file issue_body.md)
          echo "$url"
          # Issue gövdesine sığmayan rapor (ör. Tüm Bölümler) aynı issue'ya ilk yorum olarak eklenir.
          stamp=$(basename "$body" .md | sed 's/^issue-//')
          for c in $(ls -1 eu_funding_tracker/reports/yorum-*-"$stamp".md 2>/dev/null | sort); do
            gh issue comment "$url" --body-file "$c"
          done

      - name: Hata bildir
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "AB fon taraması başarısız ($(date -u +%F))" \
            --body "@${{ github.repository_owner }} haftalık tarama hata verdi. Ayrıntılar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
