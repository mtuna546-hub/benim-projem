name: AB Fon Çağrı Taraması

on:
  schedule:
    # Her Çarşamba 09:00 (İstanbul, UTC+3)
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eu-funding-report
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r eu_funding_tracker/requirements.txt

      - name: Testler
        working-directory: eu_funding_tracker
        run: python -m unittest discover -s tests

      - name: Portalı tara, eşleştir ve e-postala
        working-directory: eu_funding_tracker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'mtuna546@gmail.com' }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASSWORD" ]; then
            python track.py --email
          else
            echo "::warning::SMTP_USER / SMTP_PASSWORD secret'ları tanımlı değil; rapor e-postalanmadan üretildi."
            python track.py
          fi

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-fon-raporu
          path: eu_funding_tracker/reports/
          if-no-files-found: ignore

      - name: Raporu ve durumu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eu_funding_tracker/state.json
          git add -f eu_funding_tracker/reports/
          git diff --cached --quiet || git commit -m "Güncel AB fon raporu ve durum güncellemesi: $(date -u +%F)"
          git push
