name: EIT kaynak kontrolü

# eit_sources.json veya eit_sources.py değişen PR'larda, sitelerin okunup okunamadığını ve
# hangi çağrı bağlantılarının bulunduğunu gösterir. Hiçbir şey kaydetmez, issue açmaz.
on:
  pull_request:
    paths:
      - "eu_funding_tracker/eit_sources.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r eu_funding_tracker/requirements.txt
      - name: Kaynakları oku
        working-directory: eu_funding_tracker
        run: python eit_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
